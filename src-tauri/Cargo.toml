[package]
name = "mantle"
version = "0.1.0"
description = "A web-based Wayland shell"
authors = []
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "mantle"
path = "src/main.rs"

[[bin]]
name = "generate-bindings"
path = "src/bin/generate_bindings.rs"

[lib]
name = "mantle_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.7"
inventory = "0.3"
tokio = { version = "1", features = ["full"] }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_22"] }
gdk = "0.18"
gtk-layer-shell = "0.8"
zbus = { version = "4", features = ["tokio"] }
ammonia = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
