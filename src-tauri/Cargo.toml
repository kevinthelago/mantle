[package]
name = "mantle"
version = "0.1.0"
description = "A web-based Wayland shell"
authors = []
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "mantle"
path = "src/main.rs"

[[bin]]
name = "generate-bindings"
path = "src/bin/generate_bindings.rs"

[lib]
name = "mantle_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
inventory = "0.3"
# Config loading + hot-reload
toml = "0.8"
dirs = "5"
notify = "6"
# Async runtime (shared with zbus, watcher bridge)
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
sysinfo = "0.31"

# Launcher — cross-platform deps
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nucleo = "0.5"
sled = "0.34"
shellexpand = "3"
which = "6"


base64   = "0.22"
# Styling-loader: runtime npm tool fetch, verify, cache, and compile
reqwest  = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2     = "0.10"
hex      = "0.4"
flate2   = "1"
tar      = "0.4"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
zbus = { version = "4", features = ["tokio"] }
ammonia = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# XDG desktop entry parsing (gettext-sys requires GNU gettext; Linux only)
freedesktop-desktop-entry = "0.5"
futures-util = "0.3"
pipewire = { version = "0.8", optional = true }

[features]
pipewire-audio = ["dep:pipewire"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
