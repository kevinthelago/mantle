name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always
  XDG_RUNTIME_DIR: /tmp/xdg-runtime

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ─────────────────────────────────────────────────
      # Tauri 2 (webkit2gtk-4.1 / GTK3) + gtk-layer-shell + headless compositor.
      # Always installed so the cache is warm before the scaffold lands.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev \
            libgtk-layer-shell0 \
            gir1.2-gtklayershell-0.1 \
            sway \
            xvfb \
            squashfs-tools \
            libfuse2 \
            rpm

      # ── Toolchains ──────────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js 24
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Only enable npm cache once the lockfile exists
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Cache Cargo
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Install deps ────────────────────────────────────────────────────────
      - name: npm ci
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      # ── Rust lint & format ──────────────────────────────────────────────────
      - name: rustfmt check
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # ── JS/TS lint & format ─────────────────────────────────────────────────
      - name: ESLint
        if: hashFiles('package.json') != '' && hashFiles('.eslintrc*', 'eslint.config*') != ''
        run: npm run lint

      - name: Prettier check
        if: hashFiles('package.json') != ''
        run: npm run format:check

      - name: TypeScript typecheck
        if: hashFiles('tsconfig.json') != ''
        run: npm run typecheck

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: cargo test
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: npm test
        if: hashFiles('package.json') != ''
        run: npm test

      # ── tauri-specta bindings staleness gate ────────────────────────────────
      # Regenerates TS command bindings from Rust and fails if committed
      # files are out of date. Keeps the typed bridge always in sync.
      - name: Check tauri-specta bindings are up to date
        if: hashFiles('src-tauri/src/bin/generate_bindings.rs') != '' && hashFiles('src/lib/bridge/bindings.ts') != ''
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --bin generate-bindings
          git diff --exit-code -- 'src/lib/bridge/'

      # ── Headless Wayland compositor (nested sway) ───────────────────────────
      # Used for integration tests that require a live Wayland display.
      - name: Start headless Wayland compositor
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          mkdir -p /tmp/xdg-runtime
          chmod 700 /tmp/xdg-runtime
          WLR_BACKENDS=headless \
          WLR_LIBINPUT_NO_DEVICES=1 \
          XDG_RUNTIME_DIR=/tmp/xdg-runtime \
          sway --headless 2>/dev/null &
          for i in $(seq 1 20); do
            [ -S "/tmp/xdg-runtime/wayland-1" ] && break
            sleep 0.5
          done
          echo "WAYLAND_DISPLAY=wayland-1" >> "$GITHUB_ENV"

      # ── Build verification ───────────────────────────────────────────────────
      - name: Build frontend (production)
        if: hashFiles('package.json') != ''
        run: npm run build

  # ── Nightly publish ─────────────────────────────────────────────────────────
  # Runs after CI passes on every push to develop. Produces a raw binary and
  # uploads it to the rolling "nightly" pre-release on GitHub so that
  # install.sh --channel nightly resolves to this artifact.
  nightly:
    name: Publish nightly
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev \
            libgtk-layer-shell0 \
            gir1.2-gtklayershell-0.1

      - name: Setup Rust (stable)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 24
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Cache Cargo
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Build nightly binary
        if: hashFiles('package-lock.json') != '' && hashFiles('src-tauri/Cargo.toml') != ''
        run: npx tauri build --no-bundle

      # Stage into `artifacts/`, NOT `dist/` — `dist/` is Vite's frontend output
      # (tauri.conf.json `frontendDist`), which `tauri build` repopulates with
      # index.html + assets/.  Staging there made `sha256sum *` fail on the
      # assets directory, so this job never published anything.
      - name: Package nightly artifact
        if: hashFiles('package-lock.json') != '' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/mantle artifacts/mantle_nightly_x86_64-linux
          cd artifacts && sha256sum * > SHA256SUMS

      - name: Publish nightly pre-release
        if: hashFiles('package-lock.json') != '' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --prerelease \
            --title "nightly" \
            --notes "Automated nightly build from \`develop\` ($(git rev-parse --short HEAD))" \
            artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
