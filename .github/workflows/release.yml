name: Release

on:
  push:
    tags:
      # Only semantic version tags trigger a release
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ─────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev \
            libgtk-layer-shell0 \
            gir1.2-gtklayershell-0.1 \
            squashfs-tools \
            libfuse2 \
            rpm \
            patchelf

      # ── Toolchains ──────────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Build ────────────────────────────────────────────────────────────────
      - name: npm ci
        run: npm ci

      - name: Build Tauri bundles (AppImage / .deb / .rpm / binary)
        run: npx tauri build --bundles appimage,deb,rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Collect artifacts ───────────────────────────────────────────────────
      - name: Gather release artifacts
        id: artifacts
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          BINARY="src-tauri/target/release/mantle"
          VERSION="${GITHUB_REF_NAME}"   # e.g. v1.2.3

          mkdir -p dist

          # AppImage
          find "$BUNDLE_DIR/appimage" -name "*.AppImage" -exec cp {} "dist/mantle_${VERSION}_amd64.AppImage" \; 2>/dev/null || true

          # Debian package
          find "$BUNDLE_DIR/deb" -name "*.deb" -exec cp {} "dist/mantle_${VERSION}_amd64.deb" \; 2>/dev/null || true

          # RPM package
          find "$BUNDLE_DIR/rpm" -name "*.rpm" -exec cp {} "dist/mantle-${VERSION}-1.x86_64.rpm" \; 2>/dev/null || true

          # Raw binary
          [ -f "$BINARY" ] && cp "$BINARY" "dist/mantle_${VERSION}_x86_64-linux" || true

          # Checksums
          cd dist && sha256sum * > SHA256SUMS

          echo "dist_dir=$(pwd)" >> "$GITHUB_OUTPUT"
          ls -lh

      # ── Publish ─────────────────────────────────────────────────────────────
      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "mantle $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Prune — keep last 3 releases ────────────────────────────────────────
      # List all releases sorted newest-first; delete any beyond the third.
      - name: Prune old releases (keep last 3)
        run: |
          gh release list --json tagName --limit 100 \
            | jq -r '.[3:][].tagName' \
            | while IFS= read -r tag; do
                echo "Deleting old release: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
